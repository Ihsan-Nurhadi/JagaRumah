# MediaMTX Configuration - Nayaka CCTV Gateway
# Digunakan untuk me-relay RTSP Tapo C500 (dari OpenVPN) menjadi WebRTC / RTSP Low-Latency

logLevel: info
logDestinations: [stdout]

# 1. RTSP Server
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

# 2. WebRTC Server (Latensi Super Rendah ~0.2 - 0.5s)
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
# Port UDP untuk transmisi media WebRTC (buka port ini di firewall VPS jika aktif)
webrtcLocalUDPAddress: :8189
# Isi dengan IP Publik VPS Anda (atau domain misal: cctv.domainanda.com)
webrtcAdditionalHosts: []

# 3. HLS Server (fMP4 HLS stabil untuk kamera dengan GOP bervariasi)
hls: yes
hlsAddress: :8888
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 2s

# 4. API Control (Untuk registrasi stream dinamis)
api: yes
apiAddress: :9997

# Izinkan akses API kontrol dari localhost dan subnet internal Docker (172.16.0.0/12)
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass:
    ips: ['127.0.0.1', '::1', '172.16.0.0/12']
    permissions:
      - action: api
      - action: metrics
      - action: pprof

# 5. Paths (Stream Kamera)
paths:
  # Kamera ditarik dari sumber RTSP (via OpenVPN) hanya saat ada penonton.
  # Path dibuat dinamis lewat API (port 9997) atau didaftarkan manual di sini.
  all_others:
