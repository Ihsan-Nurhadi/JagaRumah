services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nayaka-web-app
    restart: unless-stopped
    ports:
      # Expose langsung port 701 ke publik
      - "701:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - ./recordings:/recordings:ro
      - ./evidence:/evidence
      - ./talk-tmp:/talk-tmp

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: nayaka-mediamtx
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: nayaka-go2rtc
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
      - ./talk-tmp:/talk-tmp

  tapo-talk:
    build:
      context: ./tapo-talk-worker
      dockerfile: Dockerfile
    container_name: nayaka-tapo-talk
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./talk-tmp:/talk-tmp

  onvif-event-worker:
    build:
      context: ./onvif-event-worker
      dockerfile: Dockerfile
    container_name: nayaka-onvif-event-worker
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      - WEB_INTERNAL_URL=http://127.0.0.1:701
      - MEDIAMTX_RTSP_BASE=rtsp://127.0.0.1:8554
      - EVIDENCE_DIR=/evidence
    volumes:
      - ./evidence:/evidence
