services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nayaka-web-app
    restart: unless-stopped
    ports:
      # Expose langsung port 701 ke publik
      - "701:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - ./recordings:/recordings:ro
      - ./talk-tmp:/talk-tmp

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: nayaka-mediamtx
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: nayaka-go2rtc
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
      - ./talk-tmp:/talk-tmp
